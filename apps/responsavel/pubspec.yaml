name: responsavel
description: App do responsável — Segurança dos Filhos.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  google_maps_flutter: ^2.6.0
  just_audio: ^0.9.36 # reproduz os clipes da escuta
  shared:
    path: ../../packages/shared

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
