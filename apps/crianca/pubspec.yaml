name: crianca
description: App do aparelho da criança — Segurança dos Filhos.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_messaging: ^15.0.0
  geolocator: ^10.1.0 # compatível com Flutter 3.24.5
  flutter_foreground_task: ^8.0.0 # notificação persistente visível
  flutter_webrtc: ^0.11.7 # escuta online ao vivo (mic indicator do Android aparece)
  flutter_ringtone_player: ^4.0.0 # sinal sonoro
  shared_preferences: ^2.2.0
  shared:
    path: ../../packages/shared

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
