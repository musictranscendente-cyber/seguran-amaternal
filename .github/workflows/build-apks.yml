name: Build APKs

# Compila os dois apps (responsável e criança) na nuvem e disponibiliza os
# APKs para download. Roda só quando você aciona (botão "Run workflow"),
# para não consumir o espaço grátis de artifacts do GitHub.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: responsavel
            crianca: ""
          - app: crianca
            crianca: "--crianca"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5" # compatível com flutter_webrtc 0.11.7
          channel: stable

      - name: Gerar projeto Android
        working-directory: apps/${{ matrix.app }}
        run: flutter create --platforms=android --org com.seguranca .

      - name: Instalar dependências
        working-directory: apps/${{ matrix.app }}
        run: flutter pub get

      - name: google-services.json
        run: |
          python3 tool/google_services.py apps/${{ matrix.app }} \
            com.seguranca.${{ matrix.app }} \
            "${{ matrix.app == 'crianca' && secrets.GOOGLE_SERVICES_CRIANCA || secrets.GOOGLE_SERVICES_RESPONSAVEL }}"

      - name: Preparar Android (permissões, Firebase, Device Admin)
        run: |
          python3 tool/preparar_android.py apps/${{ matrix.app }} \
            ${{ matrix.crianca }} --maps-key "${{ secrets.MAPS_API_KEY }}"

      - name: Diagnóstico (arquivos gerados)
        working-directory: apps/${{ matrix.app }}
        run: |
          echo "===== settings.gradle ====="; cat android/settings.gradle* || true
          echo "===== app/build.gradle ====="; cat android/app/build.gradle* || true
          echo "===== AndroidManifest.xml ====="; cat android/app/src/main/AndroidManifest.xml || true

      - name: Compilar APK (debug)
        working-directory: apps/${{ matrix.app }}
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee /tmp/build-${{ matrix.app }}.log

      - name: Publicar erro como issue (se falhar)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Build do app **${{ matrix.app }}** falhou (run ${{ github.run_id }})."
            echo ""
            echo '```'
            tail -n 120 /tmp/build-${{ matrix.app }}.log 2>/dev/null || echo "(sem log)"
            echo '```'
          } > /tmp/corpo.md
          gh issue create \
            --title "Build falhou: ${{ matrix.app }} (run ${{ github.run_id }})" \
            --body-file /tmp/corpo.md \
            --repo ${{ github.repository }} || true

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: warn
          retention-days: 3 # APKs se apagam sozinhos em 3 dias (poupa espaço)
